name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/Linktopus_Frontend

            git pull origin main

            cat > .env << EOF
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}
            VITE_UNIPILE_BASE_URL=${{ secrets.VITE_UNIPILE_BASE_URL }}
            VITE_UNIPILE_API_KEY=${{ secrets.VITE_UNIPILE_API_KEY }}
            VITE_UNIPILE_ACCOUNT_ID=${{ secrets.VITE_UNIPILE_ACCOUNT_ID }}
            EOF

            npm install
            npm run build

            sudo systemctl reload apache2
            echo "Frontend deployed."